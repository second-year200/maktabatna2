<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141922;--s1:#1c2330;--s2:#252e3e;--line:#2f394c;--tx:#e8ebf2;--mu:#98a2b8;--gold:#f2b632;--red:#ef5b6b;--blue:#4c8dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;line-height:1.6}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
h1{font-size:28px;margin:8px 0 2px;font-weight:700}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.btn{background:var(--gold);color:#1a1405;font-weight:700;border-radius:12px;padding:12px 18px}
.btn.ghost{background:var(--s2);color:var(--tx);font-weight:600}
.btn.red{background:#3a2229;color:#ff9aa6}
.note{color:var(--mu);font-size:13px;min-height:20px}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.who{font-size:12px;color:var(--mu);direction:ltr;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;display:flex;gap:8px;align-items:center}
.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.file{display:flex;justify-content:space-between;align-items:center;gap:12px;border-inline-start:5px solid var(--h,#888)}
.file .nm{font-weight:600;word-break:break-word}
.file .mt{font-size:12px;color:var(--mu)}
.acts{display:flex;gap:8px;flex:none}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.up{position:relative}
.up input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.up .btn{display:block;text-align:center;border:2px dashed #7a5d12}
/* viewer */
#viewer{position:fixed;inset:0;background:#0d1117;display:flex;flex-direction:column;z-index:10}
.vbar{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 6px}
.vbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.pill{direction:ltr;display:flex;align-items:center;gap:2px;overflow-x:auto;margin:4px 10px;padding:8px 10px;background:#1d222c;border-radius:22px;box-shadow:0 6px 20px #0008;flex:none}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:#aab0bd;padding:6px 8px;border-radius:12px;min-width:50px;position:relative;font-weight:400;flex:none}
.tb i{font-style:normal;font-size:19px;line-height:1.2}.tb small{font-size:10px;font-weight:700}
.tb.on{background:rgba(242,182,50,.22);color:#fff}
.tb.on::after{content:'';position:absolute;bottom:2px;width:16px;height:2px;background:#6aa8ff;border-radius:2px}
.sep{width:1px;height:34px;background:#ffffff1f;margin:0 6px;flex:none}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;flex:none;margin:0 3px}
.sw.on{border-color:#6aa8ff}
.opts{display:flex;gap:8px;align-items:center;justify-content:center;padding:2px 10px 6px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.opts .tb{flex-direction:row;min-width:0;background:var(--s1);padding:5px 10px;font-size:13px}
.opts .tb.on::after{display:none}
#pages{flex:1;overflow:auto;padding:8px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.pg{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 2px 14px #0009}
.pg canvas.base{display:block;width:100%;height:auto}
.pg canvas.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#pages.draw .pg canvas.ov{pointer-events:auto;touch-action:none}
#pages.draw.pen .pg canvas.ov{touch-action:pan-y pinch-zoom}
#pages.night .pg canvas.base{filter:invert(1) hue-rotate(180deg)}
.ti{position:absolute;z-index:3;min-width:120px;background:#fffbe6;border:1px dashed #999;color:#000;padding:2px 4px;font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;max-width:90%}
</style>
</head>
<body>

<!-- تسجيل الدخول -->
<div id="auth" class="wrap" hidden>
  <h1>📚 مكتبتنا</h1>
  <p class="sub">شيتات الجامعة في مكان واحد، تقرأها وتلوّن عليها. الحساب يعطيك إياه المشرف.</p>
  <div class="card">
    <label for="em">البريد الإلكتروني</label>
    <input type="email" id="em" dir="ltr" autocomplete="email">
    <label for="pw" style="margin-top:12px">كلمة المرور (6 أحرف على الأقل)</label>
    <input type="password" id="pw" dir="ltr" autocomplete="current-password">
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn" id="signin" style="flex:1">دخول</button>
    </div>
    <div class="note" id="amsg" style="margin-top:10px"></div>
  </div>
</div>

<!-- المكتبة -->
<div id="lib" class="wrap" hidden>
  <div class="top"><h1>📚 مكتبتنا</h1><span class="who" id="who"></span></div>
  <p class="sub">اختر المادة ثم افتح الشيت.</p>
  <div id="adm" class="card" hidden>
    <label for="subj">المادة (للمشرف: ارفع شيتات جديدة)</label>
    <input type="text" id="subj" placeholder="مثال: Micro (Microbiology)" list="subjList">
    <datalist id="subjList"></datalist>
    <div class="up" style="margin-top:10px">
      <div class="btn">⬆️ اختيار ملفات (PDF أو صور)</div>
      <input type="file" id="pick" accept="application/pdf,.pdf,image/*" multiple>
    </div>
    <div class="note" id="ust" style="margin-top:8px"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div style="text-align:center;margin-top:20px"><button class="btn ghost" id="out">تسجيل الخروج</button></div>
</div>

<!-- العارض -->
<div id="viewer" hidden>
  <div class="vbar"><button class="btn ghost" id="back" style="padding:8px 14px">→ رجوع</button><b id="vt"></b><span class="note" id="pgn"></span></div>
  <div class="pill" id="tools">
    <button class="tb" id="redo"><i>↪️</i><small>إعادة</small></button>
    <button class="tb" id="undo"><i>↩️</i><small>تراجع</small></button>
    <span class="sep"></span>
    <span id="cols" style="display:flex"></span>
    <span class="sep"></span>
    <button class="tb" data-t="text"><i>🔤</i><small>كتابة</small></button>
    <button class="tb" data-t="erase"><i>🧽</i><small>ممحاة</small></button>
    <button class="tb" data-t="hl"><i>🖍</i><small>تلوين</small></button>
    <button class="tb on" data-t="scroll"><i>✋</i><small>تمرير</small></button>
    <button class="tb" data-t="pen"><i>✏️</i><small>قلم</small></button>
  </div>
  <div class="opts">
    <span>السماكة</span><input type="range" id="sz" min="1" max="12" value="4" style="width:90px">
    <button class="tb" id="zo">－</button><button class="tb" id="zi">＋</button>
    <button class="tb" id="nt">🌙 ليلي</button>
    <button class="tb" id="po">🖊 قلم فقط</button>
    <span id="sv"></span>
  </div>
  <div id="pages"></div>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=(t,ms=3500)=>{const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms)};
const {SUPABASE_URL,SUPABASE_ANON_KEY}=window.CONFIG||{};
if(!/^https?:/.test(SUPABASE_URL||'')){document.body.innerHTML='<div class="wrap"><h1>الموقع يحتاج إعداد</h1><p class="sub">افتح الملف config.js وضع بيانات Supabase.</p></div>';throw new Error('config')}
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let me=null,isAdmin=false,files=[],filter='الكل',lastUid=null;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const sizeTxt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

/* ---------- الحساب ---------- */
const amsg=t=>$('amsg').textContent=t;
$('signin').onclick=async()=>{amsg('...');const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});amsg(error?'تعذر الدخول: '+error.message:'')};
$('out').onclick=()=>sb.auth.signOut();
async function route(session){
  me=session?session.user:null;
  if(me&&me.id===lastUid)return;lastUid=me?me.id:null;
  $('auth').hidden=!!me;$('lib').hidden=!me;$('viewer').hidden=true;
  if(!me)return;
  $('who').textContent=me.email;
  const {data}=await sb.from('profiles').select('is_admin').eq('id',me.id).maybeSingle();
  isAdmin=!!(data&&data.is_admin);$('adm').hidden=!isAdmin;
  await loadFiles()}
sb.auth.onAuthStateChange((_e,s)=>{route(s)});
sb.auth.getSession().then(({data})=>route(data.session));

/* ---------- المكتبة ---------- */
async function loadFiles(){
  const {data,error}=await sb.from('files').select('*').order('created_at',{ascending:false});
  if(error)toast('تعذر تحميل الملفات: '+error.message);
  files=data||[];renderLib()}
function renderLib(){
  const subs=[...new Set(files.map(f=>f.subject))];
  if(filter!=='الكل'&&!subs.includes(filter))filter='الكل';
  $('subjList').innerHTML=subs.map(s=>`<option value="${esc(s)}">`).join('');
  $('chips').innerHTML=['الكل',...subs].map(s=>`<button class="chip ${s===filter?'on':''}" data-s="${esc(s)}">${s==='الكل'?'':`<span class="dot" style="background:hsl(${hue(s)} 70% 60%)"></span>`}${esc(s)}</button>`).join('');
  const shown=files.filter(f=>filter==='الكل'||f.subject===filter);
  $('list').innerHTML=shown.length?shown.map(f=>`<div class="card file" style="--h:hsl(${hue(f.subject)} 70% 60%)">
    <div><div class="nm">${esc(f.name)}</div><div class="mt">${esc(f.subject)} · ${sizeTxt(f.size||0)} · ${new Date(f.created_at).toLocaleDateString('ar')}</div></div>
    <div class="acts"><button class="btn" data-o="${f.id}">فتح</button>${isAdmin?`<button class="btn red" data-d="${f.id}">حذف</button>`:''}</div></div>`).join('')
    :'<div class="empty">ما فيه ملفات في هذه المادة بعد.</div>'}
$('chips').onclick=e=>{const b=e.target.closest('[data-s]');if(b){filter=b.dataset.s;renderLib()}};
$('list').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.o)return openFile(files.find(f=>f.id===b.dataset.o));
  if(b.dataset.d){
    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.arm='';b.textContent='حذف'},3000);return}
    const f=files.find(x=>x.id===b.dataset.d);
    await sb.storage.from('sheets').remove([f.path]);
    const {error}=await sb.from('files').delete().eq('id',f.id);
    if(error)toast('تعذر الحذف: '+error.message);loadFiles()}};
$('pick').onchange=async e=>{
  const list=[...e.target.files];e.target.value='';const subject=$('subj').value.trim()||'بدون مادة';let ok=0;
  for(const f of list){
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(!(ext==='pdf'||f.type.startsWith('image/'))){$('ust').textContent='تم تجاهل '+f.name;continue}
    $('ust').textContent='جاري رفع '+f.name+'...';
    const path=crypto.randomUUID()+'.'+ext;
    const up=await sb.storage.from('sheets').upload(path,f,{contentType:f.type||(ext==='pdf'?'application/pdf':'image/jpeg')});
    if(up.error){$('ust').textContent='❌ '+f.name+': '+up.error.message;continue}
    const ins=await sb.from('files').insert({name:f.name,subject,path,size:f.size});
    if(ins.error){$('ust').textContent='❌ '+ins.error.message;await sb.storage.from('sheets').remove([path]);continue}
    ok++}
  if(ok)$('ust').textContent='✅ تمت إضافة '+ok+' ملف';
  filter=subject;loadFiles()};

/* ---------- العارض + التلوين ---------- */
let tool='scroll',color='#ef5b6b',pw=4,penOnly=false,zoom=1,cur=null,PGS=[],IO=null,lastPg=null,redoS=[],curPage=1;
const COLORS=['#f2b632','#ef5b6b','#4c8dff','#16a34a','#111111','#8b5cf6'];
const drawCols=()=>{$('cols').innerHTML=COLORS.map(c=>`<button class="sw ${c===color?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')};
function setTool(t){tool=t;document.querySelectorAll('.tb[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('pages').classList.toggle('draw',t!=='scroll');
  if(t==='hl')setColor('#f2b632');else if((t==='pen'||t==='text')&&color==='#f2b632')setColor('#ef5b6b')}
function setColor(c){color=c;drawCols()}
$('tools').onclick=e=>{const b=e.target.closest('[data-t],[data-c]');if(!b)return;if(b.dataset.t)setTool(b.dataset.t);if(b.dataset.c)setColor(b.dataset.c)};
$('sz').oninput=e=>{pw=+e.target.value};
$('po').onclick=e=>{penOnly=!penOnly;e.currentTarget.classList.toggle('on',penOnly);$('pages').classList.toggle('pen',penOnly)};
$('nt').onclick=e=>e.currentTarget.classList.toggle('on',$('pages').classList.toggle('night'));
const setZoom=z=>{zoom=Math.max(.6,Math.min(3,z));document.querySelectorAll('.pg').forEach(p=>p.style.width=(p.dataset.w*zoom)+'px')};
$('zi').onclick=()=>setZoom(zoom+.25);$('zo').onclick=()=>setZoom(zoom-.25);
$('undo').onclick=()=>{if(lastPg&&lastPg.items.length){redoS.push([lastPg,lastPg.items.pop()]);redraw(lastPg);save(lastPg)}};
$('redo').onclick=()=>{const r=redoS.pop();if(r){r[0].items.push(r[1]);lastPg=r[0];redraw(r[0]);save(r[0])}};
drawCols();

function redraw(pg){const c=pg.ov,x=c.getContext('2d'),W=c.width;x.clearRect(0,0,W,c.height);
  for(const it of pg.items){x.globalAlpha=1;
    if(it.t==='x'){x.fillStyle=it.c;x.font='700 '+(it.s*W)+'px system-ui,Tahoma,sans-serif';x.textBaseline='top';x.textAlign='left';x.fillText(it.v,it.x*W,it.y*W);continue}
    x.strokeStyle=it.c;x.lineWidth=it.w*W;x.lineCap='round';x.lineJoin='round';const p=it.p;
    if(it.t==='p'&&p[0][2]){for(let i=1;i<p.length;i++){x.beginPath();x.lineWidth=it.w*W*(.35+1.3*(p[i][2]||p[i-1][2]));x.moveTo(p[i-1][0]*W,p[i-1][1]*W);x.lineTo(p[i][0]*W,p[i][1]*W);x.stroke()}continue}
    x.globalAlpha=it.t==='h'?.35:1;x.beginPath();x.moveTo(p[0][0]*W,p[0][1]*W);
    for(let i=1;i<p.length-1;i++)x.quadraticCurveTo(p[i][0]*W,p[i][1]*W,(p[i][0]+p[i+1][0])/2*W,(p[i][1]+p[i+1][1])/2*W);
    if(p.length>1)x.lineTo(p[p.length-1][0]*W,p[p.length-1][1]*W);else x.lineTo(p[0][0]*W+.1,p[0][1]*W);
    x.stroke()}
  x.globalAlpha=1}
const bb=it=>it.t==='x'?[it.x,it.y,it.x+it.v.length*it.s*.6,it.y+it.s*1.3]:(()=>{const xs=it.p.map(p=>p[0]),ys=it.p.map(p=>p[1]);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]})();
function save(pg){clearTimeout(pg.t);$('sv').textContent='...';
  pg.t=setTimeout(async()=>{const {error}=await sb.from('annotations').upsert({user_id:me.id,file_id:pg.fid,page:pg.n,items:pg.items,updated_at:new Date().toISOString()});
    $('sv').textContent=error?'تعذر الحفظ':'✓ تم الحفظ'},600)}
function add(pg,it){pg.items.push(it);redoS.length=0;lastPg=pg}
function textAt(pg,q){const i=document.createElement('input');i.type='text';i.className='ti';const W=pg.wrap.clientWidth,s=.02+pw*.003;
  i.style.cssText='left:'+(q[0]*100)+'%;top:'+(q[1]*W)+'px;font-size:'+(s*W)+'px';pg.wrap.append(i);i.focus();let done=false;
  const fin=()=>{if(done)return;done=true;const v=i.value.trim();i.remove();if(v){add(pg,{t:'x',c:color,x:q[0],y:q[1],s,v});redraw(pg);save(pg)}};
  i.onkeydown=e=>{if(e.key==='Enter')fin()};i.onblur=fin}
function lazy(pg){
  if(!IO)IO=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const p=en.target._pg;
    if(p&&!p.painted){p.painted=true;IO.unobserve(en.target);Promise.resolve(p.paint(p.base.getContext('2d'))).then(()=>redraw(p)).catch(()=>{p.painted=false})}}),{root:$('pages'),rootMargin:'900px 0px'});
  pg.wrap._pg=pg;IO.observe(pg.wrap)}
function addPage(file,n,pxW,pxH,dpr,paint,items){
  const wrap=document.createElement('div');wrap.className='pg';wrap.dataset.w=pxW/dpr;wrap.style.width=(pxW/dpr*zoom)+'px';
  const base=document.createElement('canvas');base.className='base';base.width=pxW;base.height=pxH;
  const ov=document.createElement('canvas');ov.className='ov';ov.width=pxW;ov.height=pxH;
  wrap.append(base,ov);$('pages').append(wrap);
  const pg={n,wrap,ov,base,items:items||[],fid:file.id,paint};PGS.push(pg);
  let drawing=false,dirty=false;
  const pt=e=>{const r=ov.getBoundingClientRect();return[+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.width).toFixed(4),e.pointerType==='pen'?+e.pressure.toFixed(2):0]};
  const erase=q=>{const n0=pg.items.length;
    pg.items=pg.items.filter(it=>{if(it.t==='x'){const b=bb(it);return!(q[0]>=b[0]-.01&&q[0]<=b[2]+.01&&q[1]>=b[1]-.01&&q[1]<=b[3]+.01)}
      return!it.p.some(p=>Math.hypot(p[0]-q[0],p[1]-q[1])<.02)});
    if(pg.items.length!==n0){dirty=true;redraw(pg)}};
  ov.onpointerdown=e=>{if(tool==='scroll'||(penOnly&&e.pointerType==='touch'))return;e.preventDefault();lastPg=pg;const q=pt(e);
    if(tool==='text'){textAt(pg,q);return}
    try{ov.setPointerCapture(e.pointerId)}catch(_){}
    drawing=true;if(tool==='erase'){erase(q);return}
    cur={t:tool==='hl'?'h':'p',c:color,w:tool==='hl'?pw*.006:pw*.001,p:[q]};add(pg,cur);redraw(pg)};
  ov.onpointermove=e=>{if(!drawing)return;e.preventDefault();const q=pt(e);if(tool==='erase'){erase(q);return}cur.p.push(q);redraw(pg)};
  const up=()=>{if(!drawing)return;drawing=false;if(tool==='erase'){if(dirty){dirty=false;save(pg)}}else if(cur)save(pg);cur=null};
  ov.onpointerup=up;ov.onpointercancel=up;
  lazy(pg);return pg}

async function openFile(f){
  if(!f)return;
  if(IO){IO.disconnect();IO=null}PGS=[];lastPg=null;redoS=[];zoom=1;curPage=1;
  $('vt').textContent=f.name;$('pgn').textContent='';$('pages').innerHTML='<div class="empty">جاري التحميل...</div>';
  $('lib').hidden=true;$('viewer').hidden=false;setTool('scroll');
  try{
    const [{data:su,error:se},{data:an}]=await Promise.all([sb.storage.from('sheets').createSignedUrl(f.path,3600),sb.from('annotations').select('page,items').eq('file_id',f.id)]);
    if(se)throw se;
    const ann={};(an||[]).forEach(r=>ann[r.page]=r.items);
    const host=$('pages'),w=Math.min(host.clientWidth-16,900),dpr=Math.min(window.devicePixelRatio||1,2);
    if(/\.pdf$/i.test(f.path)){
      const pdf=await pdfjsLib.getDocument({url:su.signedUrl}).promise;host.innerHTML='';
      for(let i=1;i<=pdf.numPages;i++){
        const p=await pdf.getPage(i),v0=p.getViewport({scale:1}),v=p.getViewport({scale:w/v0.width*dpr});
        addPage(f,i,Math.round(v.width),Math.round(v.height),dpr,x=>p.render({canvasContext:x,viewport:v}).promise,ann[i])}
    }else{
      const img=new Image();img.crossOrigin='anonymous';img.src=su.signedUrl;await img.decode();
      const sc=w/img.naturalWidth*dpr,cw=Math.round(img.naturalWidth*sc),ch=Math.round(img.naturalHeight*sc);
      host.innerHTML='';addPage(f,1,cw,ch,dpr,x=>x.drawImage(img,0,0,cw,ch),ann[1])}
    $('pgn').textContent='1/'+PGS.length;
  }catch(err){$('pages').innerHTML='<div class="empty">تعذر فتح الملف: '+esc(err.message||err)+'</div>'}}
$('pages').addEventListener('scroll',()=>{const h=$('pages');let i=0;PGS.forEach((p,k)=>{if(p.wrap.offsetTop-h.offsetTop<=h.scrollTop+h.clientHeight/3)i=k});curPage=i+1;$('pgn').textContent=PGS.length?(i+1)+'/'+PGS.length:''});
/* قرصة بإصبعين للتكبير */
const ptr=new Map();let pd=0,pz=1;const dist=()=>{const v=[...ptr.values()];return Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1])};
$('pages').addEventListener('pointerdown',e=>{if(tool!=='scroll')return;ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size===2){pd=dist();pz=zoom}});
$('pages').addEventListener('pointermove',e=>{if(ptr.has(e.pointerId)){ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size===2&&pd)setZoom(pz*dist()/pd)}});
['pointerup','pointercancel'].forEach(t=>$('pages').addEventListener(t,e=>{ptr.delete(e.pointerId);pd=0}));
$('back').onclick=()=>{$('viewer').hidden=true;$('lib').hidden=false;$('pages').innerHTML='';PGS=[]};
</script>
</body>
